plugins { id 'com.android.application' }

android {
    namespace 'in.radhakrishna.tenthouse'
    compileSdk 35
    defaultConfig {
        applicationId 'in.radhakrishna.tenthouse'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        // Replace with your HTTPS hosting URL before building the APK.
        buildConfigField 'String', 'HOSTED_APP_URL', '"https://YOUR-HOSTING-DOMAIN/index.html"'
    }
    buildFeatures { buildConfig true }
}
