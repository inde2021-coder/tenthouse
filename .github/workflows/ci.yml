name: ERP checks

on:
  push:
    branches:
      - main
      - "audit/**"
      - render-preview-test
      - render-preview-isolated
      - render-preview-bartan
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Report dependency security advisories
        run: |
          npm audit --prefix backend --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e "try { const fs=require('node:fs'); const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/npm-audit.json','utf8')); console.log('npm audit summary:', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log('npm audit package:', name, 'severity='+v.severity, 'fixAvailable='+JSON.stringify(v.fixAvailable), 'via='+v.via.map(x=>typeof x==='string'?x:x.title).join('; ')); } catch(e) { console.log('npm audit report unavailable:', e.message); }"
      - name: Check backend JavaScript syntax
        run: npm run api:check
      - name: Run business regression tests
        run: npm test
      - name: Validate package and manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Prepare standalone browser preview
        run: |
          mkdir -p preview-artifact
          cp public/index.html preview-artifact/TentHouse-Preview.html
      - name: Upload standalone browser preview
        uses: actions/upload-artifact@v4
        with:
          name: tenthouse-browser-preview
          path: preview-artifact/TentHouse-Preview.html
          if-no-files-found: error
          retention-days: 7
