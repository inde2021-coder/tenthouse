<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Steel utensils and crockery rental collection</title><desc id="desc">Polished steel plates, bowls, cooking pots, tumblers, serving dishes and cutlery arranged on premium dark shelves.</desc>
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset=".18" stop-color="#9baaba"/><stop offset=".38" stop-color="#fff"/><stop offset=".58" stop-color="#78899a"/><stop offset=".78" stop-color="#e7edf5"/><stop offset="1" stop-color="#657789"/></linearGradient>
