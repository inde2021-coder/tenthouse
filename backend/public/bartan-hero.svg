 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b692f"/><stop offset=".5" stop-color="#f7d79a"/><stop offset="1" stop-color="#9b692f"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8eeff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#83b8d5" stop-opacity=".2"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
